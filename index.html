<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BML 교통 실험실 · 5×5 기록 도전</title>
<meta name="description" content="빨간 차는 오른쪽으로, 파란 차는 아래로. 신호등 없는 교차로에서 차들은 끝내 멈출까, 같은 모습을 되풀이할까?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>BML 교통 실험실</h1>
      <p>5×5 기록 도전 · 빨간 차는 오른쪽으로, 파란 차는 아래로</p>
    </div>
    <div class="who" id="who" hidden></div>
  </div>
</header>

<main class="wrap">
  <!-- 첫 화면: 반과 학번으로 들어가기 -->
  <section id="view-login" class="login-view" aria-label="들어가기">
    <div class="panel login-card">
      <h2>5×5 기록 도전</h2>
      <p class="note">반을 고르고 학번을 적으면 시작할 수 있어요. 내가 만든 배치는 선생님 화면에 모여요.</p>
      <div class="login-grid">
        <div class="field">
          <label class="label" for="loginCls">반</label>
          <select id="loginCls"></select>
        </div>
        <div class="field">
          <label class="label" for="loginSid">학번 (다섯 자리)</label>
          <input type="text" id="loginSid" inputmode="numeric" maxlength="5" placeholder="10101" autocomplete="off">
        </div>
      </div>
      <p class="err" id="loginErr"></p>
      <button class="btn primary" id="loginBtn">시작하기</button>
      <p class="status-line" id="connLine">서버에 연결하는 중…</p>
      <button class="linkbtn" id="practiceBtn" hidden>제출 없이 연습만 하기</button>
    </div>
  </section>

  <!-- 5×5 도전 -->
  <section id="view-challenge" aria-label="5×5 기록 도전" hidden>
    <div class="challenge-layout">
      <div id="simChallenge"></div>
      <aside class="side">
        <div class="panel">
          <h2>도전 두 가지</h2>
          <p class="note">빨간 차와 파란 차의 수가 같아야 기록으로 인정돼요. 숫자는 차의 수예요.</p>
          <p class="tip">한 번에 최고 기록을 찾으려 하지 않아도 돼요. 생각나는 배치를 여러 개 만들어 보고, 고정이든 반복이든 나온 결과를 모두 제출해 보세요.</p>
          <div class="challenge-cards" id="ccards"></div>
        </div>

        <div class="panel">
          <h2>이번 배치</h2>
          <div class="result-card" id="resultCard"></div>
          <button class="btn lane" id="submitBtn" disabled>이 배치 제출하기</button>
          <p class="status-line" id="submitMsg" aria-live="polite"></p>
        </div>

        <div class="panel">
          <div class="btn-row" style="justify-content:space-between"><h2>내 제출</h2><span class="meta" id="myCount"></span></div>
          <div class="mylist" id="myList"></div>
        </div>
      </aside>
    </div>
  </section>

</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
